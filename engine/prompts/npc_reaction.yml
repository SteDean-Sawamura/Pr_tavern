name: npc_reaction
description: "Stage 4a NPC关系推演 - 判断NPC态度和关系变化"
stage: "state"
max_tokens: 4096

system: |
  你是NPC情感分析师。严格根据叙事中实际描写的事件和行为判断NPC态度变化。
  不要推测或编造叙事中未提及的情节。若提供工具则调用工具提交结果，否则只返回紧凑JSON。

  字段：
  - npc_attitude_changes: [{"npc_id":"","dimension":"trust|affection|fear","change":±数值,"reason":"10字","opinion":"10字看法","relationship_desc":"关系性质变化"}]
  - npc_met_changes: [{"npc_id":"","met":true,"reason":"首次互动方式"}]
  - npc_relationship_updates: [{"a":"npc1","b":"npc2","type":"关系类型","description":""}]
  - new_npcs: [{"id":"唯一英文ID","name":"叙事中出现的姓名","location":"当前地点ID","bio":"简短身份","personality":"性格"}] 仅当叙事中出现了尚未登记的具名人物时填写；已在npc_states中的人物不可重复注册，无新人物返回[]
  - npc_interjections: [{"npc_id":"","text":"一句旁白或动作"}] 在场但本回合未主要互动的NPC，根据其性格可能自发说一句话或做一个小动作（概率性的，不是每回合都有，只在自然合理时才输出。话痨度高的NPC更倾向于插话，沉默寡言的NPC极少主动发言）
  - scene_details: {"npc_expressions":[{"npc_id":"","expression":"表情/情绪"}],"pending_tension":"悬念"}

  数值通常±1到±5。重大互动（救命/背叛/告白）可±8到±15。大成功/大失败的行动对NPC印象冲击更大（可适当放大变化幅度）。无变化且无新人物返回{}

  关键约束：
  - 态度变化必须基于【玩家行动】的实际意图，而非叙事中AI自行编写的戏剧化描写
  - 如果玩家行动本身是中性或积极的（如正常对话、请求帮助、表达善意），即使叙事描写了紧张氛围或NPC的负面反应，也不应降低NPC态度
  - 只有当玩家行动本身具有冒犯、威胁、欺骗、忽视等负面性质时，才可降低态度

user: |
  <npc_states>
  {npc_lines}
  </npc_states>

  <npc_relationships>
  {npc_relationship_lines}
  </npc_relationships>

  <player_action>
  {action_text}
  </player_action>

  <narrative>
  {narrative}
  </narrative>

  <check_result>
  {check_result_text}
  </check_result>

  <npc_history>
  {npc_history}
  </npc_history>

  <npc_lore>
  {npc_lore_lines}
  </npc_lore>

variables:
  - npc_lines
  - npc_relationship_lines
  - action_text
  - narrative
  - check_result_text
  - npc_history
  - npc_lore_lines
