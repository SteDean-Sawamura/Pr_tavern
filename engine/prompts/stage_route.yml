name: stage_route
description: "路由阶段: 分析玩家行动，判断涉及的游戏系统和检定需求"
stage: "route"
source: "game_session.py::_run_route_stage"
max_tokens: 500

system: |
  你是场景分析器。根据玩家行动判断涉及的游戏系统和是否需要技能检定。只返回紧凑JSON，不要解释。

user: |
  位置: {location_line}
  当前游戏时间: {old_time}
  在场NPC: {npc_list_str}
  角色属性: {attr_list_str}
  玩家行动: {action_text}

  返回: {"scene_type":"social|combat|exploration|trade|travel|rest",
  "systems":["从npc/location/inventory/faction/moral/companion/deadline/clue/quest/combat/new_npc中选择相关的"],
  "scope":"minor|moderate|major",
  "focus_npcs":["填写npc_id（英文ID），不要填中文名"],
  "skill_check":{"needed":true/false,"attr":"从角色属性中选择最相关的","difficulty":"easy|medium|hard|extreme"},
  "expand_story":true/false,
  "generate_image":true/false,
  "skip_state_settlement":true/false,
  "skip_npc_reaction":true/false,
  "skip_choices":true/false,
  "context_depth":"minimal|normal|deep",
  "recall_hints":["关键词1","关键词2"]}

  skill_check规则：
  - 日常对话、简单移动、等待、休息等不需要检定(needed:false)
  - 有风险或挑战性的行动需要检定(needed:true)，如潜行、说服、战斗、调查、偷窃等
  - difficulty根据行动难度和环境判断

  expand_story规则：
  - 当剧情树大部分节点已完成、或剧情出现重大转折(scope=major)、或玩家进入全新区域时 → true
  - 日常行动、推进中的剧情尚未完结时 → false

  generate_image规则：
  - 场景发生明显视觉变化时生成图像(true)：进入新地点、战斗场面、重大事件、环境剧变、初次见面
  - 纯对话、等待、思考、小幅移动、重复场景等无明显视觉变化时不生成(false)

  skip_state_settlement规则：
  - 纯对话、信息查询、观察环境等不改变任何游戏状态的行动 → true
  - 涉及物品获取/消耗、属性变化、位置移动、时间推进等 → false

  skip_npc_reaction规则：
  - 在场NPC为空或行动完全不涉及NPC → true
  - 有NPC在场且行动可能影响NPC态度/关系 → false

  skip_choices规则：
  - 玩家正在执行连续多步动作（如计划中的步骤）、或行动结果明确无需选择 → true
  - 需要玩家做出决策、或场景自然产生多种可能性 → false

  context_depth规则：
  - minimal: 简单日常行动，不需要大量历史上下文
  - normal: 一般互动，标准上下文量
  - deep: 涉及复杂剧情线、历史伏笔、多NPC关系等需要丰富上下文

  recall_hints规则：
  - 列出1-3个关键词，用于Stage 1检索相关历史记录
  - 应包含行动涉及的核心概念：地名、NPC名、物品名、事件名等
  - 如无特别需要检索的内容，返回空数组[]


  # 条件段落（当玩家有未完成计划时追加）：
  # 注意: 玩家有未完成计划「{plan_goal}」，当前步骤: {current_step}

variables:
  - location_line     # "位置名（描述前40字）"
  - old_time          # 当前游戏时间
  - npc_list_str      # "npc_id(npc_name), ..." 或 "无"
  - attr_list_str     # "力量/敏捷/智力/魅力" 等属性名斜杠分隔
  - action_text       # 玩家行动文本
  - plan_goal         # 未完成计划目标（条件出现）
  - current_step      # 当前计划步骤（条件出现）

output_fields:
  - scene_type        # social|combat|exploration|trade|travel|rest
  - systems           # 涉及的游戏系统列表
  - scope             # minor|moderate|major
  - focus_npcs        # 关注的NPC ID列表
  - skill_check       # {needed, attr, difficulty}
  - expand_story      # 是否扩展剧情树
  - generate_image    # 是否生成场景图
  - skip_state_settlement  # 跳过状态推演（默认false）
  - skip_npc_reaction      # 跳过NPC反应（默认false）
  - skip_choices           # 跳过选项生成（默认false）
  - context_depth          # minimal|normal|deep（默认normal）
  - recall_hints           # Stage 1检索关键词（默认[]）
