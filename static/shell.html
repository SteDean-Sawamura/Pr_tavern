<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>酒馆 — AI 互动文字游戏</title>
  <link rel="stylesheet" href="/static/css/design-tokens.css">
  <link rel="stylesheet" href="/static/css/shell.css">
</head>
<body>
  <!-- 品牌条 -->
  <header class="shell-header">
    <div class="shell-brand">
      <span class="brand-icon">🍺</span>
      <span class="brand-text">酒馆</span>
    </div>
    <div class="shell-header-right">
      <span class="header-hint" id="header-hint"></span>
    </div>
  </header>

  <div class="shell-body">
    <!-- 侧栏 -->
    <nav class="shell-sidebar">
      <div class="sidebar-top">
        <button class="nav-btn active" data-target="tavern" data-url="/" title="对话模式">
          <span class="nav-icon">💬</span>
          <span class="nav-text">对话</span>
        </button>
        <button class="nav-btn" data-target="rpg" data-url="/rpg" title="RPG推演">
          <span class="nav-icon">🗺️</span>
          <span class="nav-text">RPG</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-btn" data-target="scripts" data-url="/" title="剧本管理">
          <span class="nav-icon">📚</span>
          <span class="nav-text">剧本</span>
        </button>
      </div>
      <div class="sidebar-bottom">
        <button class="nav-btn" data-target="settings" title="设置" onclick="toggleSettings()">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">设置</span>
        </button>
      </div>
    </nav>

    <!-- 内容区 -->
    <main class="shell-content">
      <iframe id="content-frame" src="/"></iframe>
    </main>
  </div>

  <!-- 状态栏 -->
  <footer class="shell-status">
    <div class="status-left">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">就绪</span>
    </div>
    <div class="status-center" id="status-mode">酒馆对话模式</div>
    <div class="status-right">
      <span id="status-model">模型: 未配置</span>
    </div>
  </footer>

  <script src="/static/js/shell.js"></script>
</body>
</html>
